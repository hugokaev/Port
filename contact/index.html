<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="/" class="site-name home-btn">Hugo Kae</a>
    <a href="/gallery/" class="nav-link" data-zoom-to="/gallery/">Gallery</a>
  </div>
</header>

<main class="contact-main">
  <div class="contact-sheet">

    <!-- The name is the page's anchor and also its h1. -->
    <h1 class="contact-name">Hugo Kae</h1>
    <p class="contact-role">Fashion &amp; Portrait Photographer</p>

    <!-- Four blocks of the same shape: a small label, a line, and a
         quieter line under it. Two of them happen to be links. Source
         order puts the addresses first, which is the order a phone
         reads them in; the grid places them on the right on a wide
         screen. -->
    <div class="contact-grid">

      <a class="contact-item contact-item--link contact-item--mail" href="mailto:mina@hugokae.com">
        <span class="contact-kind">bookings &amp; enquiries</span>
        <!-- data-text is the pink copy that wipes across on hover. -->
        <span class="contact-value" data-text="mina@hugokae.com">mina@hugokae.com</span>
        <span class="contact-note">Mina Voss &mdash; Management</span>
        <span class="contact-go" aria-hidden="true">&#8594;</span>
      </a>

      <a class="contact-item contact-item--link contact-item--social" href="https://instagram.com/hugokae_" target="_blank" rel="noopener noreferrer">
        <span class="contact-kind">instagram</span>
        <span class="contact-value" data-text="@hugokae_">@hugokae_</span>
        <span class="contact-go" aria-hidden="true">&#8599;</span>
      </a>

      <div class="contact-item contact-item--based">
        <span class="contact-kind">based</span>
        <span class="contact-line">London, UK</span>
        <span class="contact-note">Available internationally</span>
      </div>

      <div class="contact-item contact-item--hours">
        <span class="contact-kind">office hours</span>
        <span class="contact-line">Monday &ndash; Friday, 10am &ndash; 6pm</span>
        <!-- Filled in by script.js with the time in London and whether
             that falls inside the hours above. -->
        <span class="contact-note" id="contactClock">London time</span>
      </div>

    </div>
  </div>
</main>


<script src="../script.js?v=41"></script>
</body>
</html>
