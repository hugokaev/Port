<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Hugo Kae</title>
<meta name="description" content="Photography by Hugo Kae.">
<link rel="canonical" href="https://hugokae.com/">
<meta name="theme-color" content="#ffffff">

<!-- Without these a shared link previews as a bare URL. For a
     photographer that is the whole first impression, so every page
     carries a card. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hugo Kae">
<meta property="og:title" content="Hugo Kae — Photography">
<meta property="og:description" content="Photography by Hugo Kae.">
<meta property="og:url" content="https://hugokae.com/">
<meta property="og:image" content="https://hugokae.com/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Hugo Kae — photography">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hugo Kae — Photography">
<meta name="twitter:description" content="Photography by Hugo Kae.">
<meta name="twitter:image" content="https://hugokae.com/og.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css?v=63">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="/" class="site-name">Hugo Kae</a>
    <a href="/gallery/" class="nav-link" data-zoom-to="/gallery/">Gallery</a>
  </div>
  <a href="/contact/" class="contact-btn">Contact</a>
</header>

<main class="gallery">
  <button class="nav-arrow nav-prev" id="prevBtn" aria-label="Previous image">&#8249;</button>

  <figure class="gallery-figure">
    <img id="galleryImage" src="" alt="" draggable="false">
    <figcaption class="gallery-caption">
      <span id="galleryCaption"></span>
      <!-- Shown on mobile, where there are no arrows to imply a sequence. -->
      <span class="gallery-count" aria-hidden="true"><span class="count-now" id="countNow"></span> / <span id="countTotal"></span></span>
    </figcaption>
  </figure>

  <button class="nav-arrow nav-next" id="nextBtn" aria-label="Next image">&#8250;</button>
</main>

<!-- Mobile only, once per visit: the tap targets are invisible, so the
     gesture has to be taught rather than discovered. -->
<div class="tap-hint" id="tapHint" aria-hidden="true">tap either side to browse</div>

<!-- Lights the half of the screen that was tapped. -->
<div class="tap-edge" id="tapEdge" aria-hidden="true"></div>


<script src="script.js?v=43"></script>
</body>
</html>
